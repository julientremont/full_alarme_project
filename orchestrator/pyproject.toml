[project]
name = "aegis-orchestrator"
version = "0.1.0"
description = "Orchestrateur alarme AEGIS — MQTT, caméra Tapo (privacy + YOLO), Drive, alertes"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "pytapo==3.3.54",
    "opencv-python>=4.12.0.88",
    "numpy>=2.2.6",
    "ultralytics>=8.3.235",
    "python-kasa>=0.10.2",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.30.0",
    "google-auth-oauthlib>=1.2.0",
    "tinytuya>=1.13.0",
]

[tool.uv]
# CPU torch only (Pi) — évite les wheels CUDA inutiles
