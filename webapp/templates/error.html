{% extends "base.html" %}
{% block title %}Erreur {{ code }} | {{ app_name }}{% endblock %}
{% block body_class %}app-page error-page{% endblock %}
{% block content %}
<div class="page err-wrap">
    <section class="panel err-card">
        <div class="err-icon">
            <img src="{{ url_for('static', filename='aegis-mark.svg') }}" alt="" class="brand-mark" decoding="async">
        </div>
        <div class="err-code">{{ code }}</div>
        <h1 class="section-title">{{ title or 'Navigation interrompue' }}</h1>
        <p class="err-msg">{{ msg }}</p>
        <a href="{{ action_url or home_url }}" class="btn-primary btn-link">{{ action_label or 'Retour' }}</a>
    </section>
</div>
{% endblock %}
