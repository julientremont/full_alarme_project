<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification | {{ app_name }}</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ asset_v }}">
</head>
<body class="login-page">
    <div class="auth-shell">
        <section class="panel auth-card">
            <div class="auth-mark-wrap">
                <div class="auth-mark">
                    <img src="{{ url_for('static', filename='aegis-mark.svg') }}" alt="" class="brand-mark" decoding="async">
                </div>
            </div>

            <div class="auth-head">
                <p class="auth-wordmark">AEGIS</p>
                <h1 class="auth-title">Vérification</h1>
                <p class="auth-copy">Saisis le code à 6 chiffres de ton application d'authentification.</p>
            </div>

            {% if error %}<div class="error-msg" role="alert">{{ error }}</div>{% endif %}

            <form method="POST" autocomplete="off" class="auth-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="code">Code d'authentification</label>
                    <input type="text" id="code" name="code" required autofocus inputmode="numeric"
                           pattern="[0-9 ]*" maxlength="9" autocomplete="one-time-code"
                           placeholder="123 456" style="letter-spacing:.3em;text-align:center;font-size:1.25rem;">
                </div>
                <button type="submit" class="login-btn">Valider</button>
            </form>

            <p class="auth-footline"><a href="{{ url_for('login') }}" style="color:inherit;">← Retour à la connexion</a></p>
        </section>
    </div>
</body>
</html>
