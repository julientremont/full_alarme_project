[project]
name = "aegis"
version = "0.1.0"
description = "AEGIS — supervision & contrôle de l'alarme maison (Zigbee/MQTT)"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-wtf>=1.2.0",
    "flask-limiter>=3.5.0",
    "werkzeug>=3.0.0",
    "python-dotenv>=1.0.0",
    "paho-mqtt>=2.1.0",
    "pyyaml>=6.0",
    "gunicorn>=21.2.0",
    "pyotp>=2.9.0",
    "qrcode>=7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
